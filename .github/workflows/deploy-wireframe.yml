name: Deploy wireframe

# 화면정의(카탈로그 + 정의 문서)를 GitHub Pages로 발행한다.
# 발행 루트는 docs/plan/v2 — gh-pages 브랜치로 복사하지 않는다.
# wireframe만 올리면 카탈로그의 "정의 문서 ↗"(../definition/*.md)가 루트 밖을 가리켜 404가 된다.
# 루트(/)로 들어오면 docs/plan/v2/index.html이 wireframe/으로 보낸다 — 기존 공유 링크 유지.
on:
  push:
    branches: [mockup]
    paths: ['docs/plan/v2/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/plan/v2
      - id: deploy
        uses: actions/deploy-pages@v4
