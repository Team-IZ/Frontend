          - generic [ref=f11e167]: "· 행 클릭 → 교안 상세(구조 추출·매핑 승인 열람, 별도 화면·후속) — 열람은 담당도 가능, 저작(등록·재처리·검수·삭제) 액션은 총괄만(담당 뷰에선 잠김). 적용 프로젝트 = 이 교안을 참조하는 프로젝트(선택적 링크·프로젝트 생성 시 총괄이 지정, 미연결도 정상 — 그 경우 위치 안내만 생략). 상태 머신: 업로드 → 추출 중 → 추출 완료 / 추출 실패 → 매핑 대기 → 검수 대기 → 승인. 정의 안 된 전이 차단. 추출 실패는 재처리·삭제만(원본 유지). 승인 교안은 활성 매핑 연결 확인 후 삭제. 배정 밖 기수 교안 접근 차단(테넌트 격리). 자동확정 금지 — 매핑은 승인 전까지 추천 상태. 교안→문제 출제는 보류(차별성·이해도 검증 정렬, D85)."
