name: Deploy wireframe

# 화면정의(카탈로그 + 정의 문서)를 GitHub Pages로 발행한다.
# 발행 루트는 docs/plan/v2 — gh-pages 브랜치로 복사하지 않는다.
# wireframe만 올리면 카탈로그의 "정의 문서 ↗"(../definition/*.md)가 루트 밖을 가리켜 404가 된다.
# 루트(/)로 들어오면 docs/plan/v2/index.html이 wireframe/으로 보낸다 — 기존 공유 링크 유지.
on:
  push:
    branches: [mockup]
    paths: ['docs/plan/v2/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 디자인 시스템·컴포넌트 문서는 develop의 생성물이다(src/index.css에서 만들어진다).
      # 발행 시점에 develop에서 꺼내 온다 — 이 브랜치에 복사본을 두면 토큰이 바뀔 때마다
      # 사람이 옮겨야 하고, 그 동기화는 반드시 잊힌다.
      - name: Pull design docs from develop
        run: |
          git fetch --depth=1 origin develop
          git checkout FETCH_HEAD -- docs/dev
          mkdir -p docs/plan/v2/dev
          cp docs/dev/design-system.html docs/dev/components.html docs/plan/v2/dev/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/plan/v2
      - id: deploy
        uses: actions/deploy-pages@v4
