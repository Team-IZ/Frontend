    - heading "교안 관리 — 목록" [level=1] [ref=f10e5]
    - paragraph [ref=f10e6]: "교안은 프로젝트가 아니라 기수 자산(D85·B10·D91) — 선택된 기수 스코프에서 교안·버전 단위로 등록한다(한 기수의 여러 프로젝트가 공통 참조, 담당은 배정 기수 스코프·테넌트 격리). 이 화면은 컬렉션(마스터): 교안 자료를 찾아 상태를 훑고 교안 상세(구조 추출·매핑 승인)로 드릴다운하는 통로다. 상태 머신 업로드 → 추출 중 → 추출 완료 / 추출 실패 → 매핑 대기 → 검수 대기 → 승인(CUR-03). 승인된 매핑만 리포트 \"취약축→교안 위치 안내\"(MEAS-07)로 소비. 등록·구조 추출(CUR-01)·매핑 승인(CUR-02)은 별도 화면(후속). 상단 셸·기수 선택기는 전 화면 통일(기수 7기)."
