<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IZ-Get v2 · 와이어프레임</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --border:#e2e5ea; --border2:#cfd4dc;
    --text:#181b20; --text2:#5a616b; --text3:#8b929c;
    --primary:#3a4db8; --primary-soft:#eef0fb;
    --nav:#1b2030; --nav2:#262d40; --navtext:#aeb4c6;
    --warn:#d9a441; --info:#5b8fd0; --ok:#5bbd8c;
    --font:-apple-system,'Apple SD Gothic Neo',system-ui,'Segoe UI',sans-serif;
    --mono:ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;height:100vh}

  .side{width:280px;flex:0 0 280px;background:var(--nav);color:var(--navtext);display:flex;flex-direction:column;overflow:hidden}
  .side .head{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
  .side .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:#fff;margin-bottom:6px}
  .side .brand .mk{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
  .side .brand .v{font-size:10px;font-weight:700;color:var(--nav);background:var(--ok);border-radius:20px;padding:1px 7px;margin-left:2px}
  .side .head .sub{font-size:11px;color:#7d8497;line-height:1.55}
  .side .head .prog{margin-top:9px;font-size:10px;color:#8b93a8;display:flex;align-items:center;gap:7px}
  .side .head .prog .bar{flex:1;height:4px;border-radius:3px;background:#2c3346;overflow:hidden}
  .side .head .prog .bar i{display:block;height:100%;background:var(--ok);width:8%}
  .side .head .expandall{margin-top:9px;width:100%;background:none;border:1px solid #3a4258;color:#8b93a8;font-family:inherit;font-size:11px;font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer}
  .side .head .expandall:hover{color:#fff;border-color:#5c6377}
  .side .list{flex:1;overflow-y:auto;padding:10px 10px 24px}

  .grp{margin-top:14px}
  .grp:first-child{margin-top:4px}
  .grp .gt{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8b93a8}
  .grp .gt .dot{width:7px;height:7px;border-radius:50%}
  .dot.shared{background:#7d8497}.dot.super{background:#8b93a8}.dot.op{background:var(--warn)}.dot.mgr{background:#7f8ef0}.dot.tr{background:var(--info)}

  .item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--navtext);font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
  .item:hover{background:var(--nav2);color:#fff}
  .item.on{background:var(--primary);color:#fff;font-weight:600}
  .item .code{font-size:9px;font-weight:700;color:#6c7488;font-family:var(--mono);margin-right:6px}
  .item.on .code{color:rgba(255,255,255,.7)}

  .item.parent{display:flex;align-items:center;font-weight:600;color:#cdd2df}
  .item.parent .cev{margin-left:auto;font-size:10px;color:#8b93a8;transition:transform .15s}
  .grp.open > .item.parent .cev,.subgrp.open > .item.parent .cev{transform:rotate(90deg)}
  .subgrp.open > .item.parent{color:#fff}
  .subwrap{display:none;margin:3px 0 4px 16px;border-left:1px solid #3a4258}
  .subgrp.open > .subwrap{display:block}
  .item.sub{padding-left:16px;font-size:12px;position:relative}
  .item.sub::before{content:"";position:absolute;left:0;top:15px;width:9px;height:1px;background:#3a4258}

  .item.todo{color:#5c6377;cursor:default}
  .item.todo:hover{background:none;color:#5c6377}
  .item.todo::after{content:"미작업";float:right;font-size:9px;color:#4e5568;font-weight:600}
  .step{font-size:9px;font-weight:700;color:var(--warn);margin-left:6px}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .bar{height:48px;flex:0 0 48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px}
  .bar .nm{font-weight:700;font-size:14px}
  .bar .pth{font-size:11px;color:var(--text3);font-family:var(--mono)}
  .bar .sp{flex:1}
  .bar a{font-size:12px;color:var(--primary);text-decoration:none;border:1px solid var(--border2);border-radius:8px;padding:5px 11px;font-weight:600}
  .bar a:hover{background:var(--primary-soft)}
  .bar a.def{color:var(--text2)}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <div class="brand"><span class="mk">◆</span>IZ-Get 화면정의<span class="v">v2</span></div>
      <div class="sub">계층 4 · 화면 25.<br>오퍼레이터와 매니저는 나브가 다르다 — 상하 관계가 아니다.</div>
      <div class="prog"><span>진행</span><span class="bar"><i></i></span><span id="progtx">2 / 25</span></div>
      <button class="expandall" id="expandall" data-state="collapsed">전체 펼치기</button>
    </div>
    <nav class="list" id="list">

      <div class="grp">
        <div class="gt"><span class="dot shared"></span>공통 · 비로그인</div>
        <div class="subgrp" id="g-au01">
          <button class="item parent" data-toggle="g-au01"><span class="code">AU-01</span>로그인<span class="step">9단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="shared/login.html#cases" data-nm="AU-01 · 케이스 계약 11" data-def="AU-01-login">케이스 계약 11</button>
            <button class="item sub" data-src="shared/login.html#default" data-nm="AU-01 · 로그인" data-def="AU-01-login">기본</button>
            <button class="item sub" data-src="shared/login.html#loading" data-nm="AU-01 · 제출 중" data-def="AU-01-login">제출 중</button>
            <button class="item sub" data-src="shared/login.html#bad" data-nm="AU-01 · 자격 불일치" data-def="AU-01-login">자격 불일치</button>
            <button class="item sub" data-src="shared/login.html#throttled" data-nm="AU-01 · 연속 실패 지연" data-def="AU-01-login">연속 실패 지연</button>
            <button class="item sub" data-src="shared/login.html#inactive" data-nm="AU-01 · 미활성 계정" data-def="AU-01-login">미활성 계정</button>
            <button class="item sub" data-src="shared/login.html#suspended" data-nm="AU-01 · 정지된 계정" data-def="AU-01-login">정지된 계정</button>
            <button class="item sub" data-src="shared/login.html#sysfail" data-nm="AU-01 · 일시적 오류" data-def="AU-01-login">일시적 오류</button>
            <button class="item sub" data-src="shared/login.html#noctx" data-nm="AU-01 · 권한 컨텍스트 결여" data-def="AU-01-login">권한 컨텍스트 결여</button>
          </div>
        </div>

        <div class="subgrp" id="g-au02">
          <button class="item parent" data-toggle="g-au02"><span class="code">AU-02</span>회원가입 · 활성화<span class="step">11단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="shared/signup-activation.html#cases" data-nm="AU-02 · 케이스 계약 15" data-def="AU-02-signup-activation">케이스 계약 15</button>
            <button class="item sub" data-src="shared/signup-activation.html#signup" data-nm="AU-02 · 변형 A · 회원가입" data-def="AU-02-signup-activation">변형 A · 회원가입</button>
            <button class="item sub" data-src="shared/signup-activation.html#activate" data-nm="AU-02 · 변형 B · 계정 활성화" data-def="AU-02-signup-activation">변형 B · 계정 활성화</button>
            <button class="item sub" data-src="shared/signup-activation.html#loading" data-nm="AU-02 · 제출 중" data-def="AU-02-signup-activation">제출 중</button>
            <button class="item sub" data-src="shared/signup-activation.html#consent" data-nm="AU-02 · 필수 미동의" data-def="AU-02-signup-activation">필수 미동의</button>
            <button class="item sub" data-src="shared/signup-activation.html#policy" data-nm="AU-02 · 비밀번호 정책 미충족" data-def="AU-02-signup-activation">비밀번호 정책 미충족</button>
            <button class="item sub" data-src="shared/signup-activation.html#expired" data-nm="AU-02 · 초대 토큰 만료" data-def="AU-02-signup-activation">초대 토큰 만료</button>
            <button class="item sub" data-src="shared/signup-activation.html#already" data-nm="AU-02 · 이미 가입 · 활성화됨" data-def="AU-02-signup-activation">이미 가입 · 활성화됨</button>
            <button class="item sub" data-src="shared/signup-activation.html#invalid" data-nm="AU-02 · 위변조 · 다른 기수 토큰" data-def="AU-02-signup-activation">위변조 · 다른 기수 토큰</button>
            <button class="item sub" data-src="shared/signup-activation.html#notlisted" data-nm="AU-02 · 명단 외 이메일" data-def="AU-02-signup-activation">명단 외 이메일</button>
            <button class="item sub" data-src="shared/signup-activation.html#failed" data-nm="AU-02 · 저장 실패" data-def="AU-02-signup-activation">저장 실패</button>
          </div>
        </div>

        <div class="subgrp" id="g-au03">
          <button class="item parent" data-toggle="g-au03"><span class="code">AU-03</span>비밀번호 재설정<span class="step">12단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="shared/password-reset.html#cases" data-nm="AU-03 · 케이스 계약 13" data-def="AU-03-password-reset">케이스 계약 13</button>
            <button class="item sub" data-src="shared/password-reset.html#request" data-nm="AU-03 · ① 요청" data-def="AU-03-password-reset">① 요청</button>
            <button class="item sub" data-src="shared/password-reset.html#loading" data-nm="AU-03 · 제출 중" data-def="AU-03-password-reset">제출 중</button>
            <button class="item sub" data-src="shared/password-reset.html#sent" data-nm="AU-03 · 요청 후 · 동일 안내" data-def="AU-03-password-reset">요청 후 · 동일 안내</button>
            <button class="item sub" data-src="shared/password-reset.html#set" data-nm="AU-03 · ② 설정" data-def="AU-03-password-reset">② 설정</button>
            <button class="item sub" data-src="shared/password-reset.html#policy" data-nm="AU-03 · 정책 미충족" data-def="AU-03-password-reset">정책 미충족</button>
            <button class="item sub" data-src="shared/password-reset.html#samepw" data-nm="AU-03 · 지금 비밀번호와 같음" data-def="AU-03-password-reset">지금 비밀번호와 같음</button>
            <button class="item sub" data-src="shared/password-reset.html#expired" data-nm="AU-03 · 링크 만료 · 사용됨" data-def="AU-03-password-reset">링크 만료 · 사용됨</button>
            <button class="item sub" data-src="shared/password-reset.html#invalid" data-nm="AU-03 · 위변조 · 목적 불일치" data-def="AU-03-password-reset">위변조 · 목적 불일치</button>
            <button class="item sub" data-src="shared/password-reset.html#done" data-nm="AU-03 · 변경 완료" data-def="AU-03-password-reset">변경 완료</button>
            <button class="item sub" data-src="shared/password-reset.html#donepartial" data-nm="AU-03 · 변경됨 · 폐기 실패" data-def="AU-03-password-reset">변경됨 · 폐기 실패</button>
            <button class="item sub" data-src="shared/password-reset.html#failed" data-nm="AU-03 · 저장 실패" data-def="AU-03-password-reset">저장 실패</button>
          </div>
        </div>
      </div>

      <div class="grp">
        <div class="gt"><span class="dot super"></span>슈퍼어드민</div>
        <div class="subgrp" id="g-sa01">
          <button class="item parent" data-toggle="g-sa01"><span class="code">SA-01</span>기관 목록<span class="step">6단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="superadmin/console.html#cases-sa01" data-nm="SA-01 · 케이스 계약 4" data-def="SA-01-org-list">케이스 계약 4</button>
            <button class="item sub" data-src="superadmin/console.html#list" data-nm="SA-01 · 목록" data-def="SA-01-org-list">목록</button>
            <button class="item sub" data-src="superadmin/console.html#create" data-nm="SA-01 · 기관 생성 모달" data-def="SA-01-org-list">기관 생성 모달</button>
            <button class="item sub" data-src="superadmin/console.html#dupname" data-nm="SA-01 · 중복 기관명" data-def="SA-01-org-list">중복 기관명</button>
            <button class="item sub" data-src="superadmin/console.html#createfail" data-nm="SA-01 · 생성 실패 · 롤백" data-def="SA-01-org-list">생성 실패 · 롤백</button>
            <button class="item sub" data-src="superadmin/console.html#empty" data-nm="SA-01 · 기관 0" data-def="SA-01-org-list">기관 0</button>
          </div>
        </div>

        <div class="subgrp" id="g-sa02">
          <button class="item parent" data-toggle="g-sa02"><span class="code">SA-02</span>기관 상세<span class="step">11단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="superadmin/console.html#cases-sa02" data-nm="SA-02 · 케이스 계약 8" data-def="SA-02-org-detail">케이스 계약 8</button>
            <button class="item sub" data-src="superadmin/console.html#overview" data-nm="SA-02 · ① 개요" data-def="SA-02-org-detail">① 개요</button>
            <button class="item sub" data-src="superadmin/console.html#noop" data-nm="SA-02 · 오퍼레이터 0" data-def="SA-02-org-detail">오퍼레이터 0</button>
            <button class="item sub" data-src="superadmin/console.html#operators" data-nm="SA-02 · ② 오퍼레이터" data-def="SA-02-org-detail">② 오퍼레이터</button>
            <button class="item sub" data-src="superadmin/console.html#invite" data-nm="SA-02 · 초대 모달" data-def="SA-02-org-detail">초대 모달</button>
            <button class="item sub" data-src="superadmin/console.html#mailfail" data-nm="SA-02 · 초대 메일 실패" data-def="SA-02-org-detail">초대 메일 실패</button>
            <button class="item sub" data-src="superadmin/console.html#lastblock" data-nm="SA-02 · 마지막 1인 정지 차단" data-def="SA-02-org-detail">마지막 1인 정지 차단</button>
            <button class="item sub" data-src="superadmin/console.html#usage" data-nm="SA-02 · ③ 사용량 · 비용" data-def="SA-02-org-detail">③ 사용량 · 비용</button>
            <button class="item sub" data-src="superadmin/console.html#usagefail" data-nm="SA-02 · 사용량 집계 실패" data-def="SA-02-org-detail">사용량 집계 실패</button>
            <button class="item sub" data-src="superadmin/console.html#settings" data-nm="SA-02 · ④ 설정" data-def="SA-02-org-detail">④ 설정</button>
            <button class="item sub" data-src="superadmin/console.html#deleteconfirm" data-nm="SA-02 · 기관 삭제 확인" data-def="SA-02-org-detail">기관 삭제 확인</button>
          </div>
        </div>

        <div class="subgrp" id="g-sa03">
          <button class="item parent" data-toggle="g-sa03"><span class="code">SA-03</span>플랫폼 설정<span class="step">5단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="superadmin/console.html#cases-sa03" data-nm="SA-03 · 케이스 계약 4" data-def="SA-03-platform-settings">케이스 계약 4</button>
            <button class="item sub" data-src="superadmin/console.html#model" data-nm="SA-03 · 모델 · 단가" data-def="SA-03-platform-settings">모델 · 단가</button>
            <button class="item sub" data-src="superadmin/console.html#modelchange" data-nm="SA-03 · 채점 모델 변경 확인" data-def="SA-03-platform-settings">채점 모델 변경 확인</button>

            <button class="item sub" data-src="superadmin/console.html#accounts" data-nm="SA-03 · 슈퍼어드민 계정" data-def="SA-03-platform-settings">슈퍼어드민 계정</button>

      </div>

      <div class="grp">
        <div class="gt"><span class="dot op"></span>오퍼레이터</div>
        <div class="subgrp" id="g-op01">
          <button class="item parent" data-toggle="g-op01"><span class="code">OP-01</span>대시보드 · 지표판<span class="step">7단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="operator/dashboard.html#cases" data-nm="OP-01 · 케이스 계약 8" data-def="OP-01-dashboard">케이스 계약 8</button>
            <button class="item sub" data-src="operator/dashboard.html#dash" data-nm="OP-01 · ① 기본" data-def="OP-01-dashboard">① 기본</button>
            <button class="item sub" data-src="operator/dashboard.html#ok" data-nm="OP-01 · ② 조치 필요 0" data-def="OP-01-dashboard">② 조치 필요 0</button>
            <button class="item sub" data-src="operator/dashboard.html#pre" data-nm="OP-01 · ③ 회차 진행 전" data-def="OP-01-dashboard">③ 회차 진행 전</button>
            <button class="item sub" data-src="operator/dashboard.html#multi" data-nm="OP-01 · ④ 집단 미달 다건" data-def="OP-01-dashboard">④ 집단 미달 다건</button>
            <button class="item sub" data-src="operator/dashboard.html#assign" data-nm="OP-01 · ⑤ 미배정" data-def="OP-01-dashboard">⑤ 미배정</button>
            <button class="item sub" data-src="operator/dashboard.html#partial" data-nm="OP-01 · ⑥ 부분 실패" data-def="OP-01-dashboard">⑥ 부분 실패</button>
          </div>
        </div>
        <div class="subgrp open" id="g-op02">
          <button class="item parent" data-toggle="g-op02"><span class="code">OP-02</span>추이<span class="step">8단계</span><span class="cev">›</span></button>
          <div class="subwrap">
            <button class="item sub" data-src="operator/analysis.html#round" data-nm="OP-02 · ① 회차 흐름 (8회차)" data-def="OP-02-analysis">① 회차 흐름</button>
            <button class="item sub" data-src="operator/analysis.html#one" data-nm="OP-02 · ② 한 반만 오를 때" data-def="OP-02-analysis">② 한 반만 오를 때</button>
            <button class="item sub" data-src="operator/analysis.html#early" data-nm="OP-02 · ③ 2회차까지" data-def="OP-02-analysis">③ 2회차까지</button>

    <div class="bar">
      <span class="nm" id="curNm">OP-03 · 프로젝트 목록</span>
      <span class="pth" id="curPth">operator/projects.html#list</span>
      <span class="sp"></span>
      <a class="def" id="defLink" href="../definition/OP-03-project-list.md" target="_blank">정의 문서 ↗</a>
      <a id="newtab" href="operator/projects.html#list" target="_blank">새 탭에서 열기 ↗</a>
    </div>
    <iframe id="view" src="operator/projects.html#list" title="wireframe"></iframe>
  </main>
</div>
<script>
  var list = document.getElementById('list');
  var view = document.getElementById('view');
  var curNm = document.getElementById('curNm');
  var curPth = document.getElementById('curPth');
  var newtab = document.getElementById('newtab');
  var defLink = document.getElementById('defLink');

  // data-src(operator/projects.html#config) → 라우트(#/operator/projects/config)
  var routes = {};
  list.querySelectorAll('.item[data-src]').forEach(function(btn){
    var route = '#/' + btn.getAttribute('data-src').replace('.html', '').replace('#', '/');
    btn.dataset.route = route;
    routes[route] = btn;
  });

  // keepClosed — 첫 로드에서는 선택된 브랜치도 펼치지 않는다. 디폴트는 무조건 전체 접힘
  function select(btn, skipHash, keepClosed){
    var src = btn.getAttribute('data-src');
    // 해시만 바뀌면 iframe이 다시 로드되지 않는다. src를 매번 새로 넣어 라우팅을 태운다
    view.src = src;
    curNm.textContent = btn.getAttribute('data-nm');
    curPth.textContent = src;
    newtab.href = src;
    defLink.href = '../definition/' + btn.getAttribute('data-def') + '.md';
    var prev = list.querySelector('.item.on');
    if(prev) prev.classList.remove('on');
    btn.classList.add('on');
    var sg = btn.closest('.subgrp');
    if(sg && !keepClosed) sg.classList.add('open');
    if(!skipHash && location.hash !== btn.dataset.route) location.hash = btn.dataset.route;
  }

  list.addEventListener('click', function(e){
    var par = e.target.closest('.item.parent');
    if(par){ document.getElementById(par.getAttribute('data-toggle')).classList.toggle('open'); return; }
    var btn = e.target.closest('.item[data-src]');
    if(btn) select(btn);
  });

  window.addEventListener('hashchange', function(){
    var btn = routes[location.hash];
    if(btn) select(btn, true);
  });

  // 진행률 — 작업된 화면 수를 사이드바에서 직접 센다
  var doneScreens = new Set();
  list.querySelectorAll('.item[data-def]').forEach(function(b){ doneScreens.add(b.getAttribute('data-def')); });
  // 화면 수 기준(상태 수 아님) — 작업된 화면 + 미작업 화면
  var total = doneScreens.size + list.querySelectorAll('.item.todo').length;
  document.getElementById('progtx').textContent = doneScreens.size + ' / ' + total;
  document.querySelector('.prog .bar i').style.width = (doneScreens.size / total * 100) + '%';

  var initial = routes[location.hash] || list.querySelector('[data-src]');
  select(initial, true, true);

  // 전체 펼치기/접기 — 팀원이 전체 구조를 훑을 때만 쓴다
  var expandall = document.getElementById('expandall');
  expandall.addEventListener('click', function(){
    var expand = expandall.dataset.state === 'collapsed';
    list.querySelectorAll('.subgrp').forEach(function(sg){ sg.classList.toggle('open', expand); });
    expandall.dataset.state = expand ? 'expanded' : 'collapsed';
    expandall.textContent = expand ? '전체 접기' : '전체 펼치기';
  });
</script>
</body>
</html>
