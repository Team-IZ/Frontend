name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Design tokens
        run: npm run check:design

      # 토큰·컴포넌트를 고치고 문서를 다시 만들지 않으면 팀이 낡은 문서를 본다
      - name: Design doc up to date
        run: node scripts/design-doc.mjs --check

      - name: Component doc up to date
        run: node scripts/component-doc.mjs --check

      - name: Lint
        run: npm run lint

      # 커밋된 스펙이 코드 생성을 감당할 품질인가. 네트워크를 타지 않는다(api/openapi.json을 읽는다).
      # error만 실패시킨다 — warn(백엔드에 개선 요청 중인 것들)은 통과한다.
      - name: API spec
        run: |
          npm run api:test
          npm run api:check

      # 스펙만 갱신하고 생성을 안 돌린 PR을 막는다. 네트워크를 타지 않는다
      # (openapi-typescript는 devDependency라 npm ci로 이미 들어와 있다).
      # git diff는 추적되지 않는 새 파일을 못 보므로 add로 인덱스에 올린 뒤 비교한다 —
      # 오퍼레이션이 추가돼 새 파일이 생기는 경우가 정확히 그 사각지대다.
      - name: API codegen up to date
        run: |
          npm run api:gen
          git add -A -- src/api
          git diff --cached --exit-code -- src/api ':(exclude)src/api/_contract'

      # 아래 셋은 typecheck·lint·build가 **전부 통과하는 버그**를 잡는다.
      # 문법도 타입도 맞는데 규칙이 틀린 것들이라, 여기 없으면 사람이 눈으로 찾게 된다.
      # (실제로 IME 가드는 사용자가 칩 두 개 생기는 걸 보고 알려줘서 발견했다)
      #
      - name: Domain rules
        run: |
          npm run check:project
          npm run check:pagination
          npm run check:admin

      # build = tsc -b && vite build 이므로 타입 검사를 포함한다
      - name: Build
        run: npm run build
